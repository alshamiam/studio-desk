<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Studio Desk · Aria Music Academy</title>
  <meta name="description" content="Timetable, attendance, lesson packages and makeups for the music studio.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#1d0c20">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500;600&display=swap">
</head>
<body>
  <header class="top"><div class="wrap">
    <div class="brand"><img class="logo" src="/brand/aria-gold.png" srcset="/brand/aria-gold.png 1x, /brand/aria-gold@2x.png 2x" alt="Aria Music Academy" width="127" height="48"><h1 class="sr-only" id="brandName">Studio Desk</h1><div class="sub">Studio Desk<small id="brandTerm"></small></div></div>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden>
      <button data-tab="today">Today</button>
      <button data-tab="week">Timetable</button>
      <button data-tab="packages">Attendance</button>
      <button data-tab="students">Students</button>
      <button data-tab="payments" data-admin>Payments</button>
      <button data-tab="history" data-admin>History</button>
      <button data-tab="setup" data-admin>Setup</button>
    </nav>
    <div class="who-me" id="whoMe" hidden></div>
  </div></header>
  <main class="wrap" id="view"><div class="empty">Loading…</div></main>
  <div id="overlay"></div>
  <script type="module" src="/src/main.js"></script>

</html>
