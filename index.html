<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Studio Desk</title>
  <meta name="description" content="Timetable, attendance, lesson packages and makeups for the music studio.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f5f8b'/%3E%3Cg stroke='%23fff' stroke-width='2'%3E%3Cpath d='M6 10h20M6 15h20M6 20h20'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
</head>
<body>
  <header class="top"><div class="wrap">
    <div class="brand"><span class="staff" aria-hidden="true"></span><h1 id="brandName">Studio Desk</h1><small id="brandTerm"></small></div>
    <nav class="tabs" id="tabs" aria-label="Sections" hidden>
      <button data-tab="today">Today</button>
      <button data-tab="week">Timetable</button>
      <button data-tab="packages">Attendance</button>
      <button data-tab="students">Students</button>
      <button data-tab="history" data-admin>History</button>
      <button data-tab="setup" data-admin>Setup</button>
    </nav>
    <div class="who-me" id="whoMe" hidden></div>
  </div></header>
  <main class="wrap" id="view"><div class="empty">Loading…</div></main>
  <div id="overlay"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
